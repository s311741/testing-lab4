rules:
  - id: hardcoded-tmp
    message: /tmp is usually RW for all users, use utilities to create private temporary directories
    languages: [java]
    severity: WARNING
    patterns:
      - pattern: "\"$TMP\""
      - metavariable-regex:
          metavariable: $TMP
          regex: /tmp/.*
  - id: exception-message-to-response
    message: serving messages from internal exceptions as part of HTTP responses
    languages: [java]
    severity: WARNING
    patterns:
      - pattern-inside: $X.result(...)
      - pattern: $E.getMessage()
  - id: queryparam-without-check
    message: query params are used without .check()
    languages: [java]
    severity: WARNING
    patterns:
      - pattern: $CTX.queryparam("...")
      - pattern-not: $CTX.queryparam("...").check(...)